syntax = "proto3";
package file.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/nrn.proto";
import "common/v1/soft_delete.proto";

message File {
  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_USER_UPLOAD = 1;   // uploaded by a workspace member
    TYPE_OCR_OUTPUT = 2;   // generated by the OCR service from a source file
  }

  message Metadata {
    message WebsiteInfo {
      // @inject_tag: bson:"title"
      string title = 1;
      // @inject_tag: bson:"url"
      string url = 2;
      // @inject_tag: bson:"favicon_url"
      string favicon_url = 3;
    }

    // @inject_tag: bson:"website_info"
    WebsiteInfo website_info = 1;
  }

  // === Identity / scope ===
  // @inject_tag: bson:"_id,omitempty"
  string file_id = 1;
  // @inject_tag: bson:"workspace_id"
  string workspace_id = 2;
  // @inject_tag: bson:"type"
  Type type = 3;
  // target_nrn is the resource this file is attached to (optional). A task upload
  // => task NRN; a chat attachment => thread NRN. For TYPE_OCR_OUTPUT it is the
  // source file's NRN. workspace_id is the always-required scope.
  // @inject_tag: bson:"target_nrn,omitempty"
  common.v1.Nrn target_nrn = 4;

  // === Content ===
  // @inject_tag: bson:"mime_type"
  string mime_type = 5;
  // @inject_tag: bson:"file_name"
  string file_name = 6;
  // @inject_tag: bson:"bytes"
  uint64 bytes = 7;
  // @inject_tag: bson:"storage_path"
  string storage_path = 8; // <bucketName>/<objectPath>
  // @inject_tag: bson:"data"
  bytes data = 9; // This content will be fetched from storage_path for raw data, return only if the client requests it.

  // === OCR linkage ===
  // ocr_file_id points to the OCR-output File (type = TYPE_OCR_OUTPUT); empty if no
  // OCR output exists. All OCR status/timing/result lives in ai.ocr.v1.OcrTask.
  // @inject_tag: bson:"ocr_file_id,omitempty"
  string ocr_file_id = 10;

  // === URLs ===
  // @inject_tag: bson:"preview_url"
  string preview_url = 11;
  // @inject_tag: bson:"download_url"
  string download_url = 12;

  // === Audit / soft-delete ===
  // @inject_tag: bson:"created_by_nrn"
  common.v1.Nrn created_by_nrn = 13;
  // @inject_tag: bson:"created_at"
  google.protobuf.Timestamp created_at = 14;
  // @inject_tag: bson:"updated_by_nrn"
  common.v1.Nrn updated_by_nrn = 15;
  // @inject_tag: bson:"updated_at"
  google.protobuf.Timestamp updated_at = 16;
  // @inject_tag: bson:"is_deleted"
  bool is_deleted = 17;
  // @inject_tag: bson:"deletion_info,omitempty"
  common.v1.DeletionInfo deletion_info = 18;

  // @inject_tag: bson:"metadata"
  Metadata metadata = 19;
}

message FileInfo {
  // @inject_tag: bson:"_id,omitempty"
  string file_id = 1;
  // @inject_tag: bson:"workspace_id"
  string workspace_id = 2;
  // @inject_tag: bson:"type"
  File.Type type = 3;
  // @inject_tag: bson:"target_nrn,omitempty"
  common.v1.Nrn target_nrn = 4;
  // @inject_tag: bson:"mime_type"
  string mime_type = 5;
  // @inject_tag: bson:"file_name"
  string file_name = 6;
  // @inject_tag: bson:"bytes"
  uint64 bytes = 7;
  // @inject_tag: bson:"ocr_file_id,omitempty"
  string ocr_file_id = 8;

  // @inject_tag: bson:"preview_url"
  string preview_url = 9;
  // @inject_tag: bson:"download_url"
  string download_url = 10;

  // @inject_tag: bson:"created_by_nrn"
  common.v1.Nrn created_by_nrn = 11;
  // @inject_tag: bson:"created_at"
  google.protobuf.Timestamp created_at = 12;
  // @inject_tag: bson:"updated_by_nrn"
  common.v1.Nrn updated_by_nrn = 13;
  // @inject_tag: bson:"updated_at"
  google.protobuf.Timestamp updated_at = 14;

  // @inject_tag: bson:"metadata"
  File.Metadata metadata = 15;
}
